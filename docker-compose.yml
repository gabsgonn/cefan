name: cefan-evolution-stack

services:
  postgres:
    image: postgres:15
    container_name: postgres_cefan
    restart: always
    command: ["postgres", "-c", "max_connections=1000"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - evolution-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_cefan
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "4000:80"
    networks:
      - evolution-net
    depends_on:
      - postgres

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - evolution-net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - evolution-net
    depends_on:
      - postgres
      - redis

  evolution-manager:
    image: evoapicloud/evolution-manager:latest
    container_name: evolution-manager
    restart: always
    ports:
      - "8081:80"
    environment:
      - VITE_EVOLUTION_API_URL=http://${VPS_IP:-localhost}:8081
      - BACKEND_URL=http://${VPS_IP:-localhost}:8081
    volumes:
      - ./nginx-manager.conf:/etc/nginx/conf.d/nginx.conf:ro
    networks:
      - evolution-net
    depends_on:
      - evolution-api

  cefan-backend:
    build:
      context: ./backend/whatsapp
      dockerfile: Dockerfile
    container_name: cefan_backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      - CEFAN_SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cefan
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-PASSWORD}
      - EVOLUTION_API_URL=http://evolution-api:8081
      - EVOLUTION_API_KEY=${AUTHENTICATION_API_KEY}
      - EVOLUTION_API_INSTANCE_NAME=${EVOLUTION_API_INSTANCE_NAME:-cefan-studio}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_MODEL=${GEMINI_API_MODEL:-gemini-1.5-flash}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_NOTIFICATION_URL=${MERCADOPAGO_NOTIFICATION_URL:-}
      - CEFAN_ADMIN_EMAIL=${CEFAN_ADMIN_EMAIL:-admin@viciotattoo.com}
      - CEFAN_ADMIN_PASSWORD=${CEFAN_ADMIN_PASSWORD:-cefan123}
    networks:
      - evolution-net
    depends_on:
      - postgres
      - evolution-api

  cefan-frontend:
    build:
      context: ./cefan
      dockerfile: Dockerfile
    container_name: cefan_frontend
    restart: always
    ports:
      - "4200:80"
    networks:
      - evolution-net
    depends_on:
      - cefan-backend

volumes:
  postgres_data:
    name: db_postgres_data
  pgadmin_data:
    name: db_pgadmin_data
  redis_data:
    name: redis_evolution_redis
  evolution_instances:
    name: evolution-api-stack_evolution_instances
  evolution_store:
    name: evolution-api-stack_evolution_store

networks:
  evolution-net:
    name: evolution-net
    driver: bridge
