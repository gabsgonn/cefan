services:
  redis:
    image: redis:latest
    container_name: redis
    networks:
      - evolution-net
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    ports:
      - "6379:6379"

volumes:
  evolution_redis:

networks:
  evolution-net:
    name: evolution-net
    external: true
