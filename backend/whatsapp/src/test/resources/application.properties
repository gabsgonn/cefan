# Configurações de Teste com Banco H2 em memória (Modo PostgreSQL)
spring.application.name=cefan-whatsapp-test

spring.datasource.url=jdbc:h2:mem:cefantest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Desativa Flyway em testes unitários para deixar o Hibernate criar as tabelas H2 em memória
spring.flyway.enabled=false

# Chave secreta de teste para JWT
security.jwt.secret=cefan-super-secret-jwt-key-minimum-256-bits-length-for-hmac-sha256-security-vicio-tattoo
security.jwt.expiration-ms=86400000

# Clients externos (URLs fictícias de teste)
evolution.api.url=http://localhost:8081
evolution.api.key=test-key
evolution.api.instance-name=test-instance

gemini.api.key=test-key
mercadopago.access.token=test-token
