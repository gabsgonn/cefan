spring.application.name=cefan-whatsapp

# Servidor
server.port=${SERVER_PORT:8082}

# Banco de Dados PostgreSQL (cefan)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cefan}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Evolution API Client
evolution.api.url=${EVOLUTION_API_URL:http://localhost:8080}
evolution.api.key=${EVOLUTION_API_KEY:sua_chave_apikey_aqui}
evolution.api.instance-name=${EVOLUTION_API_INSTANCE_NAME:cefan-studio}
