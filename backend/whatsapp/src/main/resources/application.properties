spring.application.name=cefan-whatsapp

# Servidor
server.port=${CEFAN_SERVER_PORT:8082}

# Banco de Dados PostgreSQL (cefan)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cefan}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Evolution API Client
evolution.api.url=${EVOLUTION_API_URL:http://localhost:8081}
evolution.api.key=${EVOLUTION_API_KEY:sua_chave_apikey_aqui}
evolution.api.instance-name=${EVOLUTION_API_INSTANCE_NAME:cefan-studio}
evolution.api.polls.enabled=${EVOLUTION_POLLS_ENABLED:true}

# Google Gemini AI Vision
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash}
gemini.api.fallback-model=${GEMINI_API_FALLBACK_MODEL:gemini-3.5-flash-lite}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.api.max-attempts=${GEMINI_API_MAX_ATTEMPTS:2}
gemini.api.backoff-ms=${GEMINI_API_BACKOFF_MS:500}
gemini.api.timeout-ms=${GEMINI_API_TIMEOUT_MS:18000}
gemini.api.thinking-level=${GEMINI_API_THINKING_LEVEL:low}

# Mercado Pago Gateway
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.api.url=${MERCADOPAGO_API_URL:https://api.mercadopago.com/v1}
mercadopago.notification.url=${MERCADOPAGO_NOTIFICATION_URL:}
mercadopago.sandbox.enabled=${MERCADOPAGO_SANDBOX_ENABLED:false}

# Spring Security & JWT
security.jwt.secret=${JWT_SECRET:cefan-super-secret-jwt-key-minimum-256-bits-length-for-hmac-sha256-security-vicio-tattoo}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

